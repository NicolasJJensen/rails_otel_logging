name: Compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "8.1"
            rails_file: "8_1"
            ruby: "3.2"
          - rails: "8.1"
            rails_file: "8_1"
            ruby: "3.3"
          - rails: "8.1"
            rails_file: "8_1"
            ruby: "3.4"
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails_file }}.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Resolve and install
        run: |
          bundle lock --update
          bundle install --jobs 4 --retry 3
      - run: bundle exec rspec

  otel-floor:
    name: OpenTelemetry SDK 1.0
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/otel_1_0.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Resolve and install
        run: |
          bundle lock --update
          bundle install --jobs 4 --retry 3
      - run: bundle exec rspec
